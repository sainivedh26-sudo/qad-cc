[package]
name = "qdrant"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "audio_pipeline"
path = "src/main.rs"

[dependencies]
qdrant-client = "1.18.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
indicatif = "0.17"
dotenvy = "0.15"
